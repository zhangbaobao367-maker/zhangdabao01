<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global People · 管理后台</title><link rel="stylesheet" href="styles.css"><style>
body{min-height:100vh}.admin-shell{max-width:1180px;margin:auto;padding:48px 24px}.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.admin-header h1{font-size:42px;letter-spacing:-.06em;margin:0}.admin-card{background:#fff;border:1px solid var(--line);padding:24px;margin-bottom:18px}.admin-card h2{font-size:20px;margin:0 0 18px}.admin-form{display:grid;gap:14px}.admin-form label{display:grid;gap:7px;font-size:13px;font-weight:600}.admin-form input,.admin-form textarea,.admin-form select{border:1px solid var(--line);background:#fff;padding:11px;font:inherit;font-size:13px}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.admin-actions{display:flex;gap:10px;align-items:center}.admin-status{font-size:13px;color:#4e8369}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tab{border:1px solid var(--line);background:#fff;padding:10px 14px;white-space:nowrap}.tab.active{background:var(--dark);color:#fff}.data-row{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:13px 0;font-size:13px}.data-row img{width:52px;height:42px;object-fit:cover;background:#dcebe1}.row-actions{display:flex;gap:7px}.small-button{border:1px solid var(--line);background:#fff;padding:7px 9px;font-size:11px}.danger{color:#a54d42}.dropzone{border:1px dashed #aebeb7;padding:18px;text-align:center;color:var(--muted)}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.admin-header{display:block}.admin-header .outline-button{margin-top:16px}.data-row{grid-template-columns:1fr 1fr}.row-actions{grid-column:1/-1}}
</style></head><body><main class="admin-shell">
<header class="admin-header"><div><p class="eyebrow">GLOBAL PEOPLE / ADMIN</p><h1>内容管理后台</h1></div><button id="signOut" class="outline-button hidden">退出登录</button></header>
<section id="loginCard" class="admin-card"><h2>管理员登录</h2><p class="muted">使用 Supabase Authentication 中创建的管理员账号。</p><form id="loginForm" class="admin-form admin-grid"><label>邮箱<input name="email" type="email" required></label><label>密码<input name="password" type="password" required></label><div><button class="primary-button" type="submit">登录</button><p id="loginStatus" class="admin-status"></p></div></form></section>
<section id="dashboard" class="hidden"><nav class="tabs" id="tabs"><button class="tab active" data-tab="settings">站点设置</button><button class="tab" data-tab="people">人才资源</button><button class="tab" data-tab="regions">区域管理</button><button class="tab" data-tab="resources">资源卡片</button><button class="tab" data-tab="media">轮播与跑道</button><button class="tab" data-tab="leads">访客线索</button></nav>
<section class="admin-card panel" data-panel="settings"><h2>站点设置</h2><p class="muted">前台暖色赛博风格首页分为上、中、下三个板块；选择语言后，前台所有固定文案和已填写的双语板块内容会统一切换。</p><form id="settingsForm" class="admin-form"><div class="admin-grid"><label>前台语言<select name="language"><option value="zh">中文</option><option value="en">English</option></select></label><label>公司名称<input name="company_name"></label><label>客服系统 URL<input name="customer_service_url" type="url" required></label><label>上板块标题（中文）<textarea name="section_one_title" rows="2"></textarea></label><label>上板块标题（English）<textarea name="section_one_title_en" rows="2"></textarea></label><label>上板块介绍（中文）<textarea name="section_one_intro" rows="3"></textarea></label><label>上板块介绍（English）<textarea name="section_one_intro_en" rows="3"></textarea></label><label>中板块标题（中文）<textarea name="section_two_title" rows="2"></textarea></label><label>中板块标题（English）<textarea name="section_two_title_en" rows="2"></textarea></label><label>中板块介绍（中文）<textarea name="section_two_intro" rows="3"></textarea></label><label>中板块介绍（English）<textarea name="section_two_intro_en" rows="3"></textarea></label><label>下板块标题（中文）<textarea name="section_three_title" rows="2"></textarea></label><label>下板块标题（English）<textarea name="section_three_title_en" rows="2"></textarea></label><label>下板块介绍（中文）<textarea name="section_three_intro" rows="3"></textarea></label><label>下板块介绍（English）<textarea name="section_three_intro_en" rows="3"></textarea></label></div><h3>三段独立优惠提示</h3><div class="admin-grid"><label>上板块折扣比例<input name="discount_one_percent" type="number" min="0" max="100"></label><label>上板块优惠标题<input name="discount_one_title"></label><label>上板块优惠说明<textarea name="discount_one_intro" rows="2"></textarea></label><label>中板块折扣比例<input name="discount_two_percent" type="number" min="0" max="100"></label><label>中板块优惠标题<input name="discount_two_title"></label><label>中板块优惠说明<textarea name="discount_two_intro" rows="2"></textarea></label><label>下板块折扣比例<input name="discount_three_percent" type="number" min="0" max="100"></label><label>下板块优惠标题<input name="discount_three_title"></label><label>下板块优惠说明<textarea name="discount_three_intro" rows="2"></textarea></label></div><label>兼容旧版首页标题<textarea name="hero_title" rows="2"></textarea></label><label>兼容旧版首页介绍<textarea name="hero_intro" rows="2"></textarea></label><label>公司资料展示内容<textarea name="company_intro" rows="4"></textarea></label><div class="admin-actions"><button class="primary-button">保存站点设置</button><span id="settingsStatus" class="admin-status"></span></div></form></section>
<section class="admin-card panel hidden" data-panel="people"><h2>人才资源</h2><p class="muted">区域页会按“排序”字段循环弹出人才：第 1-6 位显示为 1-1 至 6-1，第 7 位开始为 1-2、2-2……图片、姓名、职位和简介均来自这里。</p><form id="personForm" class="admin-form"><input type="hidden" name="id"><div class="admin-grid"><label>姓名<input name="name" required></label><label>职位<input name="role"></label><label>图片<input name="image_url" type="url" placeholder="图片 URL"></label><label>排序<input name="sort_order" type="number" value="0"></label></div><label>介绍<textarea name="description" rows="3"></textarea></label><div class="admin-actions"><button class="primary-button">保存人才</button><button type="button" class="outline-button" data-reset="personForm">清空</button><span id="personStatus" class="admin-status"></span></div></form><div id="peopleList"></div></section>
<section class="admin-card panel hidden" data-panel="regions"><h2>区域管理</h2><form id="regionForm" class="admin-form"><input type="hidden" name="id"><div class="admin-grid"><label>区域名称<input name="name" required></label><label>英文名称<input name="english_name"></label><label>排序<input name="sort_order" type="number" value="0"></label><label>显示<select name="is_visible"><option value="true">显示</option><option value="false">隐藏</option></select></label></div><label>区域介绍<textarea name="description" rows="2"></textarea></label><div class="admin-actions"><button class="primary-button">保存区域</button><button type="button" class="outline-button" data-reset="regionForm">清空</button><span id="regionStatus" class="admin-status"></span></div></form><div id="regionsList"></div></section>
<section class="admin-card panel hidden" data-panel="resources"><h2>资源卡片</h2><form id="resourceForm" class="admin-form"><input type="hidden" name="id"><div class="admin-grid"><label>所属区域<select name="region_id" id="resourceRegion" required></select></label><label>名称<input name="name" required></label><label>图片<input name="image_url" type="url"></label><label>排序<input name="sort_order" type="number" value="0"></label></div><label>自我介绍<textarea name="description" rows="3"></textarea></label><div class="admin-actions"><button class="primary-button">保存资源</button><button type="button" class="outline-button" data-reset="resourceForm">清空</button><span id="resourceStatus" class="admin-status"></span></div></form><div id="resourcesList"></div></section>
<section class="admin-card panel hidden" data-panel="media"><h2>首页轮播与照片跑道</h2><form id="slideForm" class="admin-form"><div class="admin-grid"><label>标题<input name="title"></label><label>图片 URL<input name="image_url" type="url"></label><label>跳转 URL<input name="link_url" type="url"></label><label>排序<input name="sort_order" type="number" value="0"></label></div><div class="admin-actions"><button class="primary-button">添加轮播图</button><span id="slideStatus" class="admin-status"></span></div></form><div id="slidesList"></div><hr><form id="runwayForm" class="admin-form"><div class="admin-grid"><label>图片 URL<input name="image_url" type="url"></label><label>跑道<select name="lane"><option value="left">左侧</option><option value="right">右侧</option></select></label><label>标签<input name="label"></label></div><button class="primary-button">添加跑道照片</button></form><div id="runwayList"></div></section>
<section class="admin-card panel hidden" data-panel="leads"><h2>访客提交资料</h2><div class="admin-actions"><button id="exportLeads" class="outline-button">导出 CSV</button><span id="leadsStatus" class="admin-status"></span></div><div id="leadsList"></div></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
