<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global People · 管理后台</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body{min-height:100vh}.admin-shell{max-width:1040px;margin:auto;padding:60px 24px}.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}.admin-header h1{font-size:40px;letter-spacing:-.06em;margin:0}.admin-card{background:white;border:1px solid var(--line);padding:28px;margin-bottom:20px}.admin-card h2{font-size:20px;margin:0 0 18px}.admin-form{display:grid;gap:16px}.admin-form label{display:grid;gap:7px;font-size:13px;font-weight:600}.admin-form input,.admin-form textarea{border:1px solid var(--line);padding:12px;font:inherit}.admin-actions{display:flex;gap:12px;align-items:center}.admin-status{font-size:13px;color:#4e8369}.hidden{display:none!important}.lead-row{border-top:1px solid var(--line);padding:15px 0;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;font-size:13px}.muted{color:var(--muted);font-size:13px}@media(max-width:650px){.lead-row{grid-template-columns:1fr 1fr}.admin-header{display:block}.admin-header .outline-button{margin-top:18px}}
    </style>
  </head>
  <body>
    <main class="admin-shell">
      <div class="admin-header"><div><p class="eyebrow">GLOBAL PEOPLE / ADMIN</p><h1>内容管理后台</h1></div><button id="signOut" class="outline-button hidden" type="button">退出登录</button></div>
      <section id="loginCard" class="admin-card">
        <h2>管理员登录</h2><p class="muted">请使用 Supabase Authentication 中创建的管理员账号登录。</p>
        <form id="loginForm" class="admin-form"><label>邮箱<input name="email" type="email" required /></label><label>密码<input name="password" type="password" required /></label><button class="primary-button" type="submit">登录</button><p id="loginStatus" class="admin-status"></p></form>
      </section>
      <section id="dashboard" class="hidden">
        <section class="admin-card"><h2>客服链接</h2><form id="settingsForm" class="admin-form"><label>客服系统 URL<input name="customer_service_url" type="url" placeholder="https://..." required /></label><div class="admin-actions"><button class="primary-button" type="submit">保存设置</button><span id="settingsStatus" class="admin-status"></span></div></form></section>
        <section class="admin-card"><h2>访客提交资料</h2><div id="leadsList"><p class="muted">正在加载...</p></div></section>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script>
  </body>
</html>
