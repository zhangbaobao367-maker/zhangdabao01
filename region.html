<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选择全球区域 · Global People</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body{min-height:100vh;background:#351520;color:#fff}.region-page{min-height:100vh;padding:44px 32px 70px}.region-page-head{max-width:1180px;margin:0 auto 54px;display:flex;justify-content:space-between;align-items:flex-end;gap:30px}.region-page h1{font-size:clamp(48px,7vw,88px);line-height:1;letter-spacing:-.08em;margin:0;color:#9bc9b2}.region-page-intro{max-width:330px;color:#e7c5b5;line-height:1.7;font-size:14px}.region-page .eyebrow{color:#9bc9b2}.region-page-options{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.region-page-card{min-height:156px;padding:18px;border:1px solid #9a6570;background:rgba(255,255,255,.06);color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:.25s}.region-page-card:hover{background:#ff9b63;border-color:#ff9b63;color:#351520;transform:translateY(-5px)}.region-page-card .number{font-size:11px;opacity:.65}.region-page-card strong{font-size:17px}.region-page-card small{font-size:12px}.region-page-card span:last-child{font-size:22px;align-self:flex-end}.region-back{display:inline-block;max-width:1180px;margin:0 auto 42px;position:relative;left:50%;transform:translateX(-50%);color:#e7c5b5;font-size:13px}.region-back:hover{color:#fff}@media(max-width:860px){.region-page-options{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.region-page{padding:28px 20px 50px}.region-page-head{display:block;margin-bottom:35px}.region-page-intro{margin-top:25px}.region-page-options{grid-template-columns:repeat(2,1fr)}.region-page-card{min-height:140px;padding:14px}}
    </style>
  </head>
  <body>
    <main class="region-page">
      <a class="region-back" href="index.html">← 返回首页</a>
      <header class="region-page-head">
        <div><p class="eyebrow">REGIONS / SELECT</p><h1>选择一个<br />全球区域</h1></div>
        <p class="region-page-intro">每个区域都支持独立内容、至少 100 个资源卡片和分页展示。</p>
      </header>
      <section class="region-page-options" aria-label="全球区域选择">
        <button class="region-page-card" type="button"><span class="number">01</span><strong>北美</strong><small>NORTH AMERICA</small><span>↗</span></button>
        <button class="region-page-card" type="button"><span class="number">02</span><strong>拉丁美洲</strong><small>LATIN AMERICA</small><span>↗</span></button>
        <button class="region-page-card" type="button"><span class="number">03</span><strong>欧洲</strong><small>EUROPE</small><span>↗</span></button>
        <button class="region-page-card" type="button"><span class="number">04</span><strong>亚洲</strong><small>ASIA</small><span>↗</span></button>
        <button class="region-page-card" type="button"><span class="number">05</span><strong>东南亚</strong><small>SOUTHEAST ASIA</small><span>↗</span></button>
        <button class="region-page-card" type="button"><span class="number">06</span><strong>更多区域</strong><small>MORE REGIONS</small><span>↗</span></button>
      </section>
      <a class="floating-support" id="regionSupport" href="#" target="_blank" rel="noopener">客服</a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
      (async () => {
        const link = document.querySelector("#regionSupport");
        try {
          const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          const { data } = await client.from("site_settings").select("customer_service_url").limit(1).maybeSingle();
          if (data && data.customer_service_url) link.href = data.customer_service_url;
        } catch (error) {
          console.error("Customer service link could not be loaded:", error);
        }
      })();
    </script>
  </body>
</html>
